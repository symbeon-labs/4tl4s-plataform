name: Web Validation

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-validation.yml"
  push:
    branches:
      - main
      - integration/foundation-reconciled
      - feat/web-mvp-foundation
    paths:
      - "apps/web/**"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
